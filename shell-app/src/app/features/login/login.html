<div class="login-page">

    <div class="login-box">
      <div class="login-brand">
        <span class="brand-icon">⚽</span>
        <h1>PitchIQ</h1>
        <p>La tua squadra. I tuoi dati.</p>
      </div>
  
      @if (errore()) {
        <div class="errore-box">
          <i class="pi pi-exclamation-triangle"></i>
          {{ errore() }}
        </div>
      }
  
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <div class="field">
          <label>Username</label>
          <input
            pInputText
            type="text"
            formControlName="username"
            placeholder="Inserisci username"
            autocomplete="username"
            class="input-dark"
          />
        </div>
  
        <div class="field">
          <label>Password</label>
          <p-password
            formControlName="password"
            placeholder="Inserisci password"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="input-dark w-full"
            autocomplete="current-password"
          />
        </div>
  
        <button type="submit" class="btn-accedi" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <i class="pi pi-spin pi-spinner"></i> Accesso in corso…
          } @else {
            Accedi <i class="pi pi-arrow-right"></i>
          }
        </button>
      </form>
    </div>
  
    <div class="login-bg">
      <div class="campo-pattern"></div>
    </div>
  
  </div>
