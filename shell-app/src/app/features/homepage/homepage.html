<div class="home">

    <nav class="navbar">
        <div class="navbar-brand">
            <span>⚽</span>
            <span class="brand-name">PitchIQ</span>
        </div>
        <button class="btn-logout" (click)="logout()">
            <i class="pi pi-sign-out"></i> Esci
        </button>
    </nav>

    <header class="hero">
        <p class="hero-label">BENVENUTO</p>
        <h1>La tua <span class="accent">squadra</span>,<br>tutto sotto controllo.</h1>
    </header>

    <main class="sezioni-grid">
        @for (s of sezioni; track s.route) {
        <a [routerLink]="s.route" class="sezione-card">
            <div class="card-icon">
                <i [class]="s.icon"></i>
            </div>
            <div class="card-body">
                <h2>{{ s.label }}</h2>
                <p>{{ s.descrizione }}</p>
            </div>
            <i class="pi pi-arrow-right card-arrow"></i>
        </a>
        }
    </main>

</div>
