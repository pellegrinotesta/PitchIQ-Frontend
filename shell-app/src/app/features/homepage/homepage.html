<div class="home">

    <header class="home-header">
        <div class="home-title">
            <span class="logo-icon">⚽</span>
            <h1>PitchIQ</h1>
        </div>
        <p-button label="Logout" icon="pi pi-sign-out" severity="danger" [outlined]="true" (onClick)="logout()" />
    </header>

    <main class="home-grid">
        @for (sezione of sezioni; track sezione.route) {
        <p-card [routerLink]="sezione.route" styleClass="sezione-card">
            <div class="sezione-content">
                <i [class]="sezione.icon + ' sezione-icon'"></i>
                <h2>{{ sezione.label }}</h2>
                <p>{{ sezione.descrizione }}</p>
            </div>
        </p-card>
        }
    </main>

</div>
