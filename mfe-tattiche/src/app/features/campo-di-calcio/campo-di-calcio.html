<div class="campo" (dragover)="onDragOver($event)" (drop)="onDropFromSidebar($event)">
    <!-- Linee del campo SVG -->
    <svg class="campo-linee" viewBox="0 0 100 100" preserveAspectRatio="none">
        <!-- Bordo esterno -->
        <rect x="2" y="2" width="96" height="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width=".4" />
        <!-- Linea centrocampo -->
        <line x1="2" y1="50" x2="98" y2="50" stroke="rgba(255,255,255,0.15)" stroke-width=".4" />
        <!-- Cerchio centrocampo -->
        <circle cx="50" cy="50" r="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width=".4" />
        <circle cx="50" cy="50" r=".8" fill="rgba(255,255,255,0.3)" />
        <!-- Area grande bassa -->
        <rect x="22" y="75" width="56" height="23" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width=".4" />
        <!-- Area piccola bassa -->
        <rect x="35" y="88" width="30" height="10" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width=".4" />
        <!-- Porta bassa -->
        <rect x="42" y="97" width="16" height="3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width=".5" />
        <!-- Area grande alta -->
        <rect x="22" y="2" width="56" height="23" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width=".4" />
        <!-- Area piccola alta -->
        <rect x="35" y="2" width="30" height="10" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width=".4" />
        <!-- Porta alta -->
        <rect x="42" y="0" width="16" height="3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width=".5" />
        <!-- Dischetto basso -->
        <circle cx="50" cy="84" r=".8" fill="rgba(255,255,255,0.3)" />
        <!-- Dischetto alto -->
        <circle cx="50" cy="16" r=".8" fill="rgba(255,255,255,0.3)" />
    </svg>

    <!-- Giocatori posizionati -->
    @for (p of posizioni; track p.giocatoreId) {
    <div class="giocatore-pin" [style.left.%]="p.coordX" [style.top.%]="p.coordY" draggable="true"
        (dragstart)="onDragStartPosizione($event, p)" (dragend)="draggingPosizione = null">
        <div class="pin-avatar">{{ p.numeroMaglia ?? p.cognomeGiocatore[0] }}</div>
        <div class="pin-nome">{{ p.cognomeGiocatore }}</div>
        <button class="pin-remove" (click)="rimuoviGiocatore(p)">
            <i class="pi pi-times"></i>
        </button>
    </div>
    }

    <!-- Hint se campo vuoto -->
    @if (posizioni.length === 0) {
    <div class="campo-hint">
        <i class="pi pi-arrow-left"></i>
        Trascina i giocatori dalla sidebar
    </div>
    }
</div>
