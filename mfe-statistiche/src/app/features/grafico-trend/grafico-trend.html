@if (_trend && tuttiPunti.length > 0) {
<div class="grafico-wrapper">
    <svg [attr.viewBox]="'0 0 ' + W + ' ' + H" class="grafico-svg" preserveAspectRatio="xMidYMid meet">
        <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#00ff87" stop-opacity=".2" />
                <stop offset="100%" stop-color="#00ff87" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="proiezioneGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#00ff87" stop-opacity=".6" />
                <stop offset="100%" stop-color="#00ff87" stop-opacity=".2" />
            </linearGradient>
        </defs>

        <!-- Griglia -->
        @for (t of ticksY; track t.valore) {
        <line [attr.x1]="PAD.left" [attr.y1]="t.y" [attr.x2]="W - PAD.right" [attr.y2]="t.y" stroke="#1a1a1a"
            stroke-width="1" />
        <text [attr.x]="PAD.left - 8" [attr.y]="t.y + 4" fill="#444" font-size="11" text-anchor="end">{{ t.valore
            }}</text>
        }

        <!-- Tick X -->
        @for (t of ticksX; track t.label) {
        <text [attr.x]="t.x" [attr.y]="H - 8" fill="#444" font-size="10" text-anchor="middle">{{ t.label }}</text>
        }

        <!-- Area storico -->
        <path [attr.d]="pathArea" fill="url(#areaGrad)" />

        <!-- Linea storico -->
        <path [attr.d]="pathStorico" fill="none" stroke="#00ff87" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" />

        <!-- Linea proiezione tratteggiata -->
        @if (puntiProiezione.length > 1) {
        <path [attr.d]="pathProiezione" fill="none" stroke="url(#proiezioneGrad)" stroke-width="2"
            stroke-dasharray="6,4" stroke-linecap="round" />
        }

        <!-- Separatore storico/proiezione -->
        @if (puntiStorico.length > 0 && puntiProiezione.length > 1) {
        <line [attr.x1]="puntiStorico[puntiStorico.length - 1].x" [attr.y1]="PAD.top"
            [attr.x2]="puntiStorico[puntiStorico.length - 1].x" [attr.y2]="H - PAD.bottom" stroke="#2a2a2a"
            stroke-width="1" stroke-dasharray="3,3" />
        <text [attr.x]="puntiStorico[puntiStorico.length - 1].x + 4" [attr.y]="PAD.top + 12" fill="#333"
            font-size="9">PROIEZIONE</text>
        }

        <!-- Punti interattivi -->
        @for (p of tuttiPunti; track p.periodo) {
        <circle [attr.cx]="p.x" [attr.cy]="p.y" r="5" [attr.fill]="p.isProiezione ? '#1a1a1a' : '#00ff87'"
            [attr.stroke]="'#00ff87'" stroke-width="2" class="punto" (mouseenter)="mostraTooltip(p)"
            (mouseleave)="nascondiTooltip()" />
        }

        <!-- Tooltip -->
        @if (tooltip.visible) {
        <g>
            <rect [attr.x]="tooltip.x + 10" [attr.y]="tooltip.y - 30" width="110" height="38" rx="6" ry="6"
                fill="#1a1a1a" stroke="#2a2a2a" />
            <text [attr.x]="tooltip.x + 65" [attr.y]="tooltip.y - 14" fill="#888" font-size="10" text-anchor="middle">{{
                tooltip.periodo }}</text>
            <text [attr.x]="tooltip.x + 65" [attr.y]="tooltip.y + 2"
                [attr.fill]="tooltip.isProiezione ? '#888' : '#00ff87'" font-size="13" font-weight="bold"
                text-anchor="middle">{{ tooltip.valore }}{{ tooltip.isProiezione ? ' ★' : '' }}</text>
        </g>
        }
    </svg>

    <!-- Legenda -->
    <div class="legenda">
        <div class="legenda-item">
            <svg width="24" height="4">
                <line x1="0" y1="2" x2="24" y2="2" stroke="#00ff87" stroke-width="2.5" />
            </svg>
            <span>Dati reali</span>
        </div>
        <div class="legenda-item">
            <svg width="24" height="4">
                <line x1="0" y1="2" x2="24" y2="2" stroke="#00ff87" stroke-width="2" stroke-dasharray="4,3"
                    opacity=".5" />
            </svg>
            <span>Proiezione</span>
        </div>
    </div>
</div>
} @else {
<div class="no-grafico">Inserisci almeno 2 rilevazioni per vedere il grafico</div>
}
