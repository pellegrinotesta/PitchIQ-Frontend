<p-confirmdialog />

<div class="page">

    <header class="page-header">
        <div>
            <p class="page-label">GESTIONE ROSA</p>
            <h1>Giocatori</h1>
        </div>
        <p-button label="Aggiungi" icon="pi pi-plus" (onClick)="apriNuovo()" />
    </header>

    <div class="filtri">
        <p-iconfield class="search-field">
            <p-inputicon styleClass="pi pi-search" />
            <input pInputText type="text" placeholder="Cerca per cognome…" [(ngModel)]="filtroCognome"
                (input)="carica()" />
        </p-iconfield>

        <p-select [options]="ruoliOptions" [(ngModel)]="filtroRuolo" optionLabel="label" optionValue="value"
            (onChange)="carica()" styleClass="select-filtro" />

        <p-select [options]="statiOptions" [(ngModel)]="filtroStato" optionLabel="label" optionValue="value"
            (onChange)="carica()" styleClass="select-filtro" />
    </div>

    @if (loading()) {
    <div class="stato-box">
        <p-progressspinner strokeWidth="3" styleClass="spinner-sm" />
    </div>
    } @else if (errore()) {
    <p-message severity="error">{{ errore() }}</p-message>
    } @else {
    <p-table [value]="giocatori()" [tableStyle]="{ 'min-width': '60rem' }" rowHover="true" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
            <tr>
                <th>#</th>
                <th>Giocatore</th>
                <th>Ruolo</th>
                <th>Stato</th>
                <th>Scadenza contratto</th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-g>
            <tr>
                <td class="maglia">{{ g.numeroMaglia ?? '–' }}</td>
                <td>
                    <a [routerLink]="[g.id]" class="link-nome">
                        {{ g.cognome }} {{ g.nome }}
                    </a>
                </td>
                <td class="secondario">{{ g.ruolo }}</td>
                <td>
                    <p-tag [value]="g.stato" [severity]="getSeverity(g.stato)" />
                </td>
                <td class="secondario">{{ g.contrattoFine ?? '–' }}</td>
                <td>
                    <div class="azioni">
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary"
                            (onClick)="apriModifica(g)" />
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                            (onClick)="elimina(g)" />
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="empty">Nessun giocatore trovato.</td>
            </tr>
        </ng-template>
    </p-table>
    }

</div>
